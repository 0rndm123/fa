name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: node --check src/fa_agents/web/app.js
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Demo smoke test (offline)
        run: fa-agent demo --output /tmp/FA-demo.json
