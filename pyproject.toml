[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-agents"
version = "0.1.0"
description = "Independent financial research multi-agent foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
fa-agent = "fa_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
