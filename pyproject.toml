[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-agents"
version = "0.6.0"
description = "Standalone source-backed financial research multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
]

[project.optional-dependencies]
ai = ["langchain-openai>=1.0,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[project.scripts]
fa-agent = "fa_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fa_agents = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
